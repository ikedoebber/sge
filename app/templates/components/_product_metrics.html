<!-- Product Metrics Cards -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 lg:gap-6 mb-6 md:mb-8">
  <!-- Total Quantity Card -->
  <div class="bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 p-4 md:p-6 hover:bg-white/15 transition-all duration-300 group">
    <div class="flex items-center justify-between">
      <div class="min-w-0">
        <h3 class="text-xs sm:text-sm font-medium text-gray-400 mb-1 sm:mb-2">Quantidade</h3>
        <p class="text-xl sm:text-2xl lg:text-3xl font-bold text-white truncate">{{ product_metrics.total_quantity }}</p>
        <div class="flex items-center mt-1 sm:mt-2">
          <div class="h-2 w-2 bg-blue-400 rounded-full mr-2"></div>
          <span class="text-xs text-gray-400">Em estoque</span>
        </div>
      </div>
      <div class="h-10 w-10 md:h-12 md:w-12 bg-blue-500/20 rounded-xl flex items-center justify-center group-hover:bg-blue-500/30 transition-colors duration-300 flex-shrink-0">
        <i class="bi bi-box-seam text-lg md:text-2xl text-blue-400"></i>
      </div>
    </div>
  </div>

  <!-- Cost Price Card -->
  <div class="bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 p-4 md:p-6 hover:bg-white/15 transition-all duration-300 group">
    <div class="flex items-center justify-between">
      <div class="min-w-0">
        <h3 class="text-xs sm:text-sm font-medium text-gray-400 mb-1 sm:mb-2">Custo</h3>
        <p class="text-xl sm:text-2xl lg:text-3xl font-bold text-white truncate">R$ {{ product_metrics.total_cost_price }}</p>
        <div class="flex items-center mt-1 sm:mt-2">
          <div class="h-2 w-2 bg-red-400 rounded-full mr-2"></div>
          <span class="text-xs text-gray-400">Investido</span>
        </div>
      </div>
      <div class="h-10 w-10 md:h-12 md:w-12 bg-red-500/20 rounded-xl flex items-center justify-center group-hover:bg-red-500/30 transition-colors duration-300 flex-shrink-0">
        <i class="bi bi-arrow-down-circle text-lg md:text-2xl text-red-400"></i>
      </div>
    </div>
  </div>

  <!-- Selling Price Card -->
  <div class="bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 p-4 md:p-6 hover:bg-white/15 transition-all duration-300 group">
    <div class="flex items-center justify-between">
      <div class="min-w-0">
        <h3 class="text-xs sm:text-sm font-medium text-gray-400 mb-1 sm:mb-2">Venda</h3>
        <p class="text-xl sm:text-2xl lg:text-3xl font-bold text-white truncate">R$ {{ product_metrics.total_selling_price }}</p>
        <div class="flex items-center mt-1 sm:mt-2">
          <div class="h-2 w-2 bg-green-400 rounded-full mr-2"></div>
          <span class="text-xs text-gray-400">Valor venda</span>
        </div>
      </div>
      <div class="h-10 w-10 md:h-12 md:w-12 bg-green-500/20 rounded-xl flex items-center justify-center group-hover:bg-green-500/30 transition-colors duration-300 flex-shrink-0">
        <i class="bi bi-arrow-up-circle text-lg md:text-2xl text-green-400"></i>
      </div>
    </div>
  </div>

  <!-- Profit Card -->
  <div class="bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 p-4 md:p-6 hover:bg-white/15 transition-all duration-300 group">
    <div class="flex items-center justify-between">
      <div class="min-w-0">
        <h3 class="text-xs sm:text-sm font-medium text-gray-400 mb-1 sm:mb-2">Lucro</h3>
        <p class="text-xl sm:text-2xl lg:text-3xl font-bold text-white truncate">R$ {{ product_metrics.total_profit }}</p>
        <div class="flex items-center mt-1 sm:mt-2">
          <div class="h-2 w-2 bg-yellow-400 rounded-full mr-2"></div>
          <span class="text-xs text-gray-400">Margem</span>
        </div>
      </div>
      <div class="h-10 w-10 md:h-12 md:w-12 bg-yellow-500/20 rounded-xl flex items-center justify-center group-hover:bg-yellow-500/30 transition-colors duration-300 flex-shrink-0">
        <i class="bi bi-graph-up text-lg md:text-2xl text-yellow-400"></i>
      </div>
    </div>
  </div>
</div>
